name:                typedql
version:             0.1.0.0
synopsis:            SGBD relacional embarcado com esquema no nivel de tipos
description:         Projeto da disciplina Desenvolvimento Orientado a Tipos (UFABC).
author:              Vitor Martins Bueno Lima
maintainer:          marvitox@users.noreply.github.com
license:             BSD-3-Clause
category:            Database

# Mesma convencao das listas: sem default-extensions, cada modulo declara
# explicitamente as extensoes que usa, para deixar visivel qual tecnica
# resolve qual problema.
language: Haskell2010

ghc-options:
  - -O2
  - -Wall
  - -Wextra

dependencies:
  - base
  - containers
  - text

library:
  source-dirs: src
  ghc-options:
    - -fplugin GHC.TypeLits.KnownNat.Solver
  dependencies:
    - ghc-typelits-knownnat
    - template-haskell

executables:
  typedql:
    main: Main.hs
    source-dirs: app
    dependencies:
      - typedql

tests:
  typedql-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - typedql
      - tasty
      - tasty-hunit
      - tasty-quickcheck
